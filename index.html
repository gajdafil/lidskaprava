<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’état, c’est moi – anebo ne? | Ochrana základních práv v EU</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="topbar noprint">
    <div class="brand">
      <span class="logo">L’état, c’est moi – anebo ne?</span>
      <span class="subtitle">Úřad předsedy vlády Marenské republiky</span>
    </div>
    <nav id="chapter-nav" class="chapter-nav" aria-label="Postup kampaní"></nav>
    <div class="toolbar">
      <span id="pts" class="pts-badge" hidden></span>
      <button type="button" class="top-btn" id="btn-home" hidden>Úvodní obrazovka</button>
      <button type="button" class="top-btn primary" id="btn-archive" hidden>Archiv a instituce</button>
      <button type="button" class="top-btn" id="btn-mute" title="Ztlumit nebo zapnout funkční zvuky">Zvuk: zapnuto</button>
      <div class="font-controls" role="group" aria-label="Velikost písma">
        <button type="button" class="top-btn" id="btn-fz-down" title="Zmenšit písmo">A−</button>
        <button type="button" class="top-btn" id="btn-fz-up" title="Zvětšit písmo">A+</button>
      </div>
    </div>
  </header>

  <div id="workspace" class="workspace">
    <main id="main" class="main-pane" tabindex="-1"></main>
    <div id="resizer" class="resizer noprint" hidden title="Tažením upravíte šířku panelů"></div>
    <aside id="drawer" class="drawer-pane noprint" hidden aria-label="Archiv, instituce a mapy"></aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
